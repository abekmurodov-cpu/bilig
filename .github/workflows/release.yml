# Builds Bilig for every desktop and Android, and publishes a GitHub release
# with the files the website links to. Runs when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ['v*']
    # Test builds without publishing: push to a branch named ci/<anything>.
    branches: ['ci/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # The end of the log as an annotation, readable without signing in.
            $tail = (Get-Content build.log -Tail 80) -join '%0A'
            Write-Output "::error title=flutter build windows::$tail"
            exit 1
          }
      - name: Installer and zip
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force build\dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\bilig.iss
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\dist\Bilig-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/dist/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
      - name: Tarball and .deb
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          bundle=build/linux/x64/release/bundle
          mkdir -p build/dist

          # Portable: unpack anywhere and run ./bilig
          tar -C "$bundle" -czf build/dist/Bilig-Linux-x64.tar.gz --transform 's,^\.,bilig,' .

          # Debian/Ubuntu package: installs to /opt/bilig with a menu entry
          pkg=build/deb
          mkdir -p $pkg/DEBIAN $pkg/opt/bilig $pkg/usr/bin \
            $pkg/usr/share/applications $pkg/usr/share/icons/hicolor/512x512/apps
          cp -r "$bundle"/. $pkg/opt/bilig/
          ln -s /opt/bilig/bilig $pkg/usr/bin/bilig
          cp packaging/linux/bilig.desktop $pkg/usr/share/applications/
          cp linux/runner/bilig.png $pkg/usr/share/icons/hicolor/512x512/apps/bilig.png
          cat > $pkg/DEBIAN/control <<CONTROL
          Package: bilig
          Version: $version
          Section: education
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libsecret-1-0
          Recommends: pulseaudio-utils
          Maintainer: Bilig <abekmurodov-cpu@users.noreply.github.com>
          Description: Notes that quiz you back
           Write what you learn; Bilig turns it into practice and reminds
           you before you forget.
          CONTROL
          dpkg-deb --build --root-owner-group $pkg build/dist/Bilig-Linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: Disk image
        run: |
          mkdir -p build/dmg build/dist
          cp -R build/macos/Build/Products/Release/Bilig.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Bilig -srcfolder build/dmg -ov -format UDZO build/dist/Bilig-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/dist/*

  android:
    runs-on: ubuntu-latest
    # Needs the signing key as repository secrets (see packaging/README.md);
    # without them this part is skipped.
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
        if: env.KEYSTORE != ''
      - uses: actions/setup-java@v4
        if: env.KEYSTORE != ''
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: env.KEYSTORE != ''
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signing key
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/bilig-release.jks
          cat > android/key.properties <<PROPS
          storeFile=bilig-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=bilig
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PROPS
      - name: APK
        if: env.KEYSTORE != ''
        run: |
          flutter build apk --release
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/Bilig-Android.apk
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE != ''
        with:
          name: android
          path: build/dist/*

  publish:
    needs: [windows, linux, macos, android]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
